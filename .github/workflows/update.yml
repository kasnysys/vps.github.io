name: update subscription

on:
  schedule:
    # каждые 6 часов (UTC)
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "tools/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: subscription
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Собрать vless.json
        run: python3 tools/build_sub.py

      - name: Закоммитить, если изменилось
        run: |
          git config user.name "happ-bot"
          git config user.email "happ-bot@users.noreply.github.com"
          git add vless.json
          if git diff --cached --quiet; then
            echo "без изменений"
            exit 0
          fi
          git commit -m "auto: refresh subscription $(date -u +%Y-%m-%d_%H:%M)"
          git pull --rebase --autostash
          git push
